[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isin-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented securities-identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
isin-validation-claim-audit = "isin_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["isin_validation_claim_audit*"]
